name: LevelUpMath
options:
  bundleIdPrefix: com.levelup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # universal — iPhone + iPad
    DEVELOPMENT_TEAM: "6A4J2GTB6F"     # Justin Nikolaus (paid team — signing lasts a year)
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: "YES"
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "1.0"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    # Landscape-only on both idioms (the whole UI — map, keypad, boss panels — is
    # designed for landscape). iPhone uses the un-suffixed key; iPad the ~ipad one.
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIRequiresFullScreen: "YES"
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"   # offline app, no custom crypto — skips TestFlight compliance prompt

targets:
  LevelUpMath:
    type: application
    platform: iOS
    sources:
      - path: Sources/Engine
      - path: Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levelup.addsub
        # Home-screen label — short so iPadOS doesn't truncate it, and distinct from
        # the multiplication app's "Adventure" so both can coexist on one iPad. The
        # full name "Addition Adventure" lives in the App Store record / splash art.
        INFOPLIST_KEY_CFBundleDisplayName: "Addition"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
